<div class="glass-panel p-4 rounded-xl border-b border-outline-variant/20 flex items-center gap-4">
  <div class="text-right">
    <p class="text-[10px] text-outline uppercase tracking-widest mb-1">{{ 'SEARCH.ACTIVE_ELEMENT' | translate }}</p>
    @if (activeElement(); as el) {
      <p class="text-sm font-bold text-on-surface">{{ el.name }} ({{ el.number }})</p>
    } @else {
      <p class="text-sm font-bold text-on-surface/50">{{ 'SEARCH.NONE_SELECTED' | translate }}</p>
    }
  </div>
  <button
    class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary hover:bg-primary/10 transition-colors"
    (click)="searchClick.emit()"
  >
    <span class="material-symbols-outlined">search</span>
  </button>
</div>
