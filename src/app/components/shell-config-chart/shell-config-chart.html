<div class="flex items-end gap-2 h-24">
  @for (bar of bars(); track $index) {
    <div
      class="bar w-full rounded-t-lg transition-all duration-500"
      [style.height.%]="bar.heightPercent"
    ></div>
  }
</div>
<div class="flex justify-between mt-2">
  @for (bar of bars(); track $index) {
    <span class="text-[10px] font-label text-outline text-center flex-1">{{ bar.value }}</span>
  }
</div>
